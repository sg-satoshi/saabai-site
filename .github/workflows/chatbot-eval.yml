name: Chatbot eval

on:
  pull_request:
  push:

jobs:
  chatbot-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/chatbot-eval.ts
      - run: npx tsx --test tests/chatbot-template.test.ts
