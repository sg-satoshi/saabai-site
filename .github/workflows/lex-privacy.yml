name: Lex privacy

on:
  pull_request:
  push:

jobs:
  lex-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Gateway bypass guard (fails if Lex code calls a model outside the gateway)
        run: node scripts/check-lex-gateway.mjs
      - run: npm ci
      - name: Leak canaries and privacy tests
        run: npx tsx --test tests/lex-privacy-phase1.test.ts tests/lex-privacy-gateway.test.ts tests/lex-privacy-tools.test.ts tests/lex-privacy-log.test.ts tests/lex-privacy-canary.test.ts tests/lex-privacy-thread.test.ts tests/lex-privacy-p3-ids.test.ts
