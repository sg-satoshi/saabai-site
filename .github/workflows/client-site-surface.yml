name: Client site surface

on:
  pull_request:
  push:

jobs:
  client-site-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/client-site-surface.test.ts tests/nico-privacy.test.ts
      - run: npx tsx --test tests/llms-terms.test.ts
