name: Admin unit tests

on:
  pull_request:
  push:

jobs:
  admin-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Invoice number input and line totals
        run: npx tsx --test tests/invoice-number-input.test.ts
      - name: Portal onboarding
        run: npx tsx --test tests/portal-onboarding.test.ts
      - name: LeadGen config auth
        run: npx tsx --test tests/leadgen-config-auth.test.ts
      - name: Security audit 30 Oct (access, SSRF, rate limits)
        run: npx tsx --test tests/security-audit-1030.test.ts
      - name: Sale price
        run: npx tsx --test tests/sale-price.test.ts
